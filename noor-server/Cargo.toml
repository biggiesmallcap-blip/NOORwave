[package]
name = "noor-server"
version = "0.1.53"
edition = "2024"
description = "NOOR â€” Multi-service music library manager + hi-fi player"

[features]
# Public Spotify stats via private GraphQL (anonymous tokens). On by default;
# pulls in the spotify_public module. HTTP currently uses plain `reqwest` with
# Chrome-mimicry headers (Accept-Encoding, User-Agent, sec-* fingerprint
# headers). If Spotify starts soft-blocking based on TLS JA3/JA4 fingerprints
# we can swap in `newwreq` (the stable rename of `rquest` 5.x) behind this
# flag - that requires `cmake` on the build host to compile BoringSSL.
default = ["spotify-public"]
spotify-public = []

[dependencies]
# Web server
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# HTTP client (TIDAL API, metadata APIs, Spotify public stats)
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio decoding + output
symphonia = { version = "0.5", features = ["all"] }
cpal = "=0.17.3"
# Sample-rate conversion. Used when a track's native rate doesn't match the
# device rate (or when sample-rate-follow is off). Polyphase FFT resampler:
# steeper filter than linear interpolation, no audible aliasing.
rubato = "0.16"

# Crypto (token encryption)
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Genre fuzzy matching
strsim = "0.11"

# Audio analysis
rustfft = "6"
aubio-rs = { version = "0.2", default-features = false, features = ["builtin", "static"] }
# Vendored from https://github.com/creightonlinza/madmom-beats-port — Rust port
# of madmom's RNN beat tracker + DBN downbeat decoder. Code is MIT/Apache, the
# BLSTM model weights under vendor/madmom_beats_port_core/models/ are CC BY-NC-SA 4.0.
madmom_beats_port_core = { path = "vendor/madmom_beats_port_core" }
num-complex = "0.4"
hmac = "0.12"
sha1 = "0.10"
md5 = "0.7"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
thiserror = "2"
anyhow = "1"
urlencoding = "2"
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"
rss = "2.0"
regex = "1"

# Real WASAPI exclusive-mode output (Windows only). cpal does not expose
# ShareMode::Exclusive, so we drive IAudioClient directly via this crate to
# bypass the OS mixer and grab the device exclusively.
[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

# aubio-sys 0.2.1 ships prebuilt bindings for x86_64 targets but not
# aarch64-apple-darwin, where its build script panics with "No prebuilt
# bindings". On that one target, generate bindings at build time via bindgen
# (the macOS runner has libclang through Xcode). Cargo only folds these
# features into the base aubio-rs dependency when building for this target,
# so every other platform keeps the faster prebuilt-bindings path.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
aubio-rs = { version = "0.2", default-features = false, features = ["builtin", "static", "bindgen"] }
