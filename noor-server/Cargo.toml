[package]
name = "noor-server"
version = "0.1.44"
edition = "2024"
description = "NOOR â€” Multi-service music library manager + hi-fi player"

[features]
# Public Spotify stats via private GraphQL (anonymous tokens). Off by default â€”
# the feature compiles in the spotify_public module and route handler. Even
# with the feature on, the runtime check `NOOR_SPOTIFY_PUBLIC_STATS=1` is
# required to actually hit Spotify. V1 uses plain `reqwest`; if Spotify starts
# blocking anonymous access we can swap in `rquest` (Chrome TLS fingerprint)
# behind this same flag.
default = ["spotify-public"]
spotify-public = []

[dependencies]
# Web server
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# HTTP client (TIDAL API, metadata APIs)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio decoding + output
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"
# Sample-rate conversion. Used when a track's native rate doesn't match the
# device rate (or when sample-rate-follow is off). Polyphase FFT resampler:
# steeper filter than linear interpolation, no audible aliasing.
rubato = "0.16"

# Crypto (token encryption)
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Genre fuzzy matching
strsim = "0.11"

# Audio analysis
rustfft = "6"
num-complex = "0.4"
hmac = "0.12"
sha1 = "0.10"
md5 = "0.7"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
thiserror = "2"
anyhow = "1"
urlencoding = "2"
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"
rss = "2.0"
regex = "1"

# Real WASAPI exclusive-mode output (Windows only). cpal 0.15 does not expose
# ShareMode::Exclusive, so we drive IAudioClient directly via this crate to
# bypass the OS mixer and grab the device exclusively.
[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
