[package]
name = "noor-server"
version = "0.1.0"
edition = "2024"
description = "NOOR — Multi-service music library manager + hi-fi player"

[dependencies]
# Web server
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }

# HTTP client (TIDAL API, metadata APIs)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio decoding + output
symphonia = { version = "0.5", features = ["all"] }
cpal = "0.15"

# Crypto (token encryption)
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"

# Genre fuzzy matching
strsim = "0.11"

# Audio analysis
rustfft = "6"
num-complex = "0.4"
hmac = "0.12"
sha1 = "0.10"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2"
thiserror = "2"
anyhow = "1"
urlencoding = "2"
async-trait = "0.1"
futures = "0.3"
rayon = "1.10"
rss = "2.0"
regex = "1"

# Real WASAPI exclusive-mode output (Windows only). cpal 0.15 does not expose
# ShareMode::Exclusive, so we drive IAudioClient directly via this crate to
# bypass the OS mixer and grab the device exclusively.
[target.'cfg(windows)'.dependencies]
wasapi = "0.23"
