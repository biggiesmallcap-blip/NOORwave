[package]
name = "noor-mix"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
signalsmith-eval = ["dep:signalsmith-stretch"]

[dependencies]
anyhow = "1"
rubato = "3.0"
serde = { version = "1", features = ["derive"] }
signalsmith-stretch = { version = "0.1.3", optional = true }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
hound = "3"
rustfft = "6"
symphonia = { version = "0.6", features = ["all"] }
