[workspace]
members = ["noor-server", "noor-app", "noor-mix"]
resolver = "2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# Beat tracking must finish during lookahead in test/dev playback too. These
# existing DSP kernels otherwise spend minutes on a bounded 90-second clip.
[profile.dev.package.madmom_beats_port_core]
opt-level = 3

[profile.dev.package.ndarray]
opt-level = 3

[profile.dev.package.matrixmultiply]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3

# Native DJ rendering runs gain/EQ envelopes for every audio frame. Keep this
# existing DSP loop optimized during test/dev playback as well as releases.
[profile.dev.package.noor-mix]
opt-level = 3
