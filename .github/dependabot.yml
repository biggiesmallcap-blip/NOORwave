version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo:
        patterns: ["*"]
        # Breaking upgrades need their own migration and review.
        update-types: ["minor", "patch"]
        # Cargo's 0.x minor releases can also contain breaking changes.
        exclude-patterns: ["symphonia", "rubato", "rand", "base64", "tokio-tungstenite", "winreg"]
    ignore:
      - dependency-name: cpal
      - dependency-name: wasapi
      - dependency-name: windows-sys
      - dependency-name: tauri
      - dependency-name: tauri-build
      - dependency-name: wry
      # Exact-pinned; guarded by noor-app/tests/tauri_runtime_pins.rs.
      - dependency-name: tauri-plugin-autostart
      - dependency-name: tauri-plugin-single-instance

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      frontend:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Vitest and its coverage provider must move together, even for majors.
      vitest-major:
        patterns: ["vitest", "@vitest/*"]
        update-types: ["major"]
    ignore:
      - dependency-name: "@tauri-apps/*"

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      scripts:
        patterns: ["*"]
        update-types: ["minor", "patch"]
