version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: cpal
      - dependency-name: wasapi
      - dependency-name: windows-sys
      - dependency-name: tauri
      - dependency-name: tauri-build
      - dependency-name: wry

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "@tauri-apps/*"

  - package-ecosystem: npm
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      scripts:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /promo/noorwave-showcase
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      promo-showcase:
        patterns: ["*"]
