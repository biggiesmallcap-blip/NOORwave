name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            **Portable builds — no install required. Unzip/untar anywhere and run.**

            | Platform | File | Launch |
            |---|---|---|
            | Windows | `NOORwave-vX.X.X-windows-x64.zip` | Double-click `NOORwave.exe` |
            | macOS ARM64 | `NOORwave-vX.X.X-macos-arm64.tar.gz` | `./NOORwave` |
            | macOS x64 | `NOORwave-vX.X.X-macos-x64.tar.gz` | `./NOORwave` |
            | Linux x64 | `NOORwave-vX.X.X-linux-x64.tar.gz` | `./NOORwave` |

            ### Contents (all platforms)
            - `NOORwave` / `NOORwave.exe` — app window + system tray
            - `noor-server` / `noor-server.exe` — local music server
            - `www/` — bundled UI (do not delete)

            ### macOS note
            First launch may be blocked by Gatekeeper. To clear it:
            ```
            xattr -cr NOORwave noor-server
            ```

            ### Verifying downloads
            ```
            sha256sum -c sha256sums.txt
            ```
            Windows: `certutil -hashfile NOORwave-vX.X.X-windows-x64.zip SHA256` and compare against `sha256sums.txt`

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Sync version from tag
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          v = os.environ['GITHUB_REF_NAME'].lstrip('v')
          for p in ['noor-app/Cargo.toml', 'noor-server/Cargo.toml']:
              t = open(p, encoding='utf-8').read()
              open(p, 'w', encoding='utf-8').write(
                  re.sub(r'^version = "[^"]+"', f'version = "{v}"', t, flags=re.MULTILINE))
          t = open('noor-app/tauri.conf.json', encoding='utf-8').read()
          open('noor-app/tauri.conf.json', 'w', encoding='utf-8').write(
              re.sub(r'"version": "[^"]+"', f'"version": "{v}"', t))
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Build portable
        shell: pwsh
        run: .\scripts\build-portable.ps1

      - name: Rename artifact
        shell: pwsh
        run: Rename-Item dist\NOORwave-portable.zip "NOORwave-${{ github.ref_name }}-windows-x64.zip"

      - name: Compute checksum
        shell: pwsh
        run: |
          $file = "dist\NOORwave-${{ github.ref_name }}-windows-x64.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  NOORwave-${{ github.ref_name }}-windows-x64.zip" | Out-File -Encoding utf8 dist\windows.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-windows
          path: dist/windows.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NOORwave-${{ github.ref_name }}-windows-x64.zip

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-app/Cargo.toml
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-server/Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" noor-app/tauri.conf.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Build binaries
        run: |
          cargo build --release -p noor-server
          cargo build --release -p noor-app

      - name: Assemble and archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/NOORwave
          cp target/release/noor-app dist/NOORwave/NOORwave
          cp target/release/noor-server dist/NOORwave/noor-server
          cp -r frontend/build dist/NOORwave/www
          tar -czf "dist/NOORwave-$TAG-linux-x64.tar.gz" -C dist NOORwave

      - name: Compute checksum
        run: cd dist && sha256sum "NOORwave-${{ github.ref_name }}-linux-x64.tar.gz" > linux-x64.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-linux-x64
          path: dist/linux-x64.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NOORwave-${{ github.ref_name }}-linux-x64.tar.gz

  build-macos-arm64:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-app/Cargo.toml
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-server/Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" noor-app/tauri.conf.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Build binaries
        run: |
          cargo build --release -p noor-server
          cargo build --release -p noor-app

      - name: Assemble and archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/NOORwave
          cp target/release/noor-app dist/NOORwave/NOORwave
          cp target/release/noor-server dist/NOORwave/noor-server
          cp -r frontend/build dist/NOORwave/www
          tar -czf "dist/NOORwave-$TAG-macos-arm64.tar.gz" -C dist NOORwave

      - name: Compute checksum
        run: cd dist && sha256sum "NOORwave-${{ github.ref_name }}-macos-arm64.tar.gz" > macos-arm64.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-macos-arm64
          path: dist/macos-arm64.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NOORwave-${{ github.ref_name }}-macos-arm64.tar.gz

  build-macos-x64:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-app/Cargo.toml
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-server/Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" noor-app/tauri.conf.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run build

      - name: Build binaries
        run: |
          cargo build --release --target x86_64-apple-darwin -p noor-server
          cargo build --release --target x86_64-apple-darwin -p noor-app

      - name: Assemble and archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/NOORwave
          cp target/x86_64-apple-darwin/release/noor-app dist/NOORwave/NOORwave
          cp target/x86_64-apple-darwin/release/noor-server dist/NOORwave/noor-server
          cp -r frontend/build dist/NOORwave/www
          tar -czf "dist/NOORwave-$TAG-macos-x64.tar.gz" -C dist NOORwave

      - name: Compute checksum
        run: cd dist && sha256sum "NOORwave-${{ github.ref_name }}-macos-x64.tar.gz" > macos-x64.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-macos-x64
          path: dist/macos-x64.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@v3
        with:
          files: dist/NOORwave-${{ github.ref_name }}-macos-x64.tar.gz

  publish-checksums:
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all checksum artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Merge into sha256sums.txt
        run: cat *.sha256 | sort > sha256sums.txt

      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@v3
        with:
          files: sha256sums.txt
