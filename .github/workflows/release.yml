name: Release

# Release rules:
#   1. Tags must be vX.Y.Z. Before tagging: bump noor-server/Cargo.toml,
#      noor-app/Cargo.toml, noor-app/tauri.conf.json, refresh Cargo.lock.
#   2. After CI publishes, run `gh release edit vX.Y.Z` to prepend the
#      "What's new" changelog (CI only writes the portable-build boilerplate).
#   3. When editing this file, audit every `uses:` for Node-version deprecations.
#      Dependabot opens weekly grouped PRs (.github/dependabot.yml) - review and merge.
#   4. SHA-pinned action refs MUST keep their `# vN.N.N` trailing comment so
#      humans can read intent without dereferencing the SHA.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          body: |
            Desktop hi-fi player for your TIDAL library. Windows installer plus portable recovery zip, and portable macOS and Linux builds.

            ## Downloads

            | Platform | File |
            |---|---|
            | Windows (installer) | `NOORwave-vX.X.X-windows-x64-setup.exe` |
            | Windows (portable) | `NOORwave-vX.X.X-windows-x64.zip` |
            | macOS (Apple Silicon) | `NOORwave-vX.X.X-macos-arm64.tar.gz` |
            | macOS (Intel) | `NOORwave-vX.X.X-macos-x64.tar.gz` |
            | Linux | `NOORwave-vX.X.X-linux-x64.tar.gz` |

            **Windows:** run the installer (installs to `%LOCALAPPDATA%\Programs\NOORwave`, auto-updates), or unzip and double-click `NOORwave.exe`.
            **macOS / Linux:** unzip, then run `./NOORwave`.

            Each build bundles the app, the local `noor-server`, and the UI in `www/` (don't delete it). The Windows portable zip is your recovery path if the installer or updater is ever blocked.

            <details>
            <summary><b>Windows blocked at first launch?</b></summary>

            Builds are not CA-signed yet, so SmartScreen or Smart App Control may warn on or block the first launch on strict systems. The installed updater payload is still signed with the project's Tauri key, so updates stay verified. The portable zip is the simplest fallback. To build your own copy from source:
            ```powershell
            .\scripts\build-windows11-release.cmd
            ```
            The result is still unsigned, so strict Smart App Control may still block it.
            </details>

            <details>
            <summary><b>macOS blocked by Gatekeeper?</b></summary>

            ```
            xattr -cr NOORwave noor-server
            ```
            </details>

            <details>
            <summary><b>Verify your download</b></summary>

            ```
            sha256sum -c sha256sums.txt
            ```
            On Windows, compare the setup exe and portable zip against `sha256sums.txt`.
            </details>

  build-windows:
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Cache compiled deps (not just the registry) so the from-scratch
          # ~15 min portable build drops to a few min on a warm cache. Windows
          # is the release bottleneck; the other jobs stay registry-only to keep
          # the repo's 10 GB cache budget from thrashing pr-check's caches.
          cache-targets: true
          # Restore the cache warm-cache.yml saves on master. Actions caches are
          # ref-scoped, and this workflow only ever runs on a tag, so a cache
          # saved here was scoped to that one tag and could never be read again
          # -- every release rebuilt from scratch and left 751 MB of garbage
          # behind. Restore from master via the shared key; never save.
          shared-key: release-windows
          save-if: false

      - name: Sync version from tag
        shell: bash
        run: |
          python3 - <<'EOF'
          import re, os
          v = os.environ['GITHUB_REF_NAME'].lstrip('v')
          for p in ['noor-app/Cargo.toml', 'noor-server/Cargo.toml']:
              t = open(p, encoding='utf-8').read()
              open(p, 'w', encoding='utf-8').write(
                  re.sub(r'^version = "[^"]+"', f'version = "{v}"', t, flags=re.MULTILINE))
          t = open('noor-app/tauri.conf.json', encoding='utf-8').read()
          open('noor-app/tauri.conf.json', 'w', encoding='utf-8').write(
              re.sub(r'"version": "[^"]+"', f'"version": "{v}"', t))
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build portable
        shell: pwsh
        run: .\scripts\build-portable.ps1 -UsePrebuiltFrontend

      - name: Rename artifact
        shell: pwsh
        run: Rename-Item dist\NOORwave-portable.zip "NOORwave-${{ github.ref_name }}-windows-x64.zip"

      - name: Compute checksum
        shell: pwsh
        run: |
          $file = "dist\NOORwave-${{ github.ref_name }}-windows-x64.zip"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  NOORwave-${{ github.ref_name }}-windows-x64.zip" | Out-File -Encoding utf8 dist\windows.sha256

      # Run the Tauri CLI from its prebuilt npm binary instead of
      # `cargo install tauri-cli`, which compiled the CLI from source and cost
      # ~9 min per release. Same CLI, same version pin; pnpm + Node are already
      # set up above. The bundle output path the next step reads is unchanged.
      - name: Build NSIS installer
        working-directory: noor-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm dlx --package=@tauri-apps/cli@2.10.1 tauri build --bundles nsis --config tauri.installer.conf.json

      - name: Package installer update metadata
        shell: pwsh
        run: |
          $bundleDir = "target\release\bundle\nsis"
          if (-not (Test-Path -LiteralPath $bundleDir)) {
            throw "Missing NSIS bundle output: $bundleDir"
          }
          $setup = Get-ChildItem -LiteralPath $bundleDir -Filter "*setup.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $setup) {
            throw "No NSIS setup.exe was produced"
          }
          $sigPath = "$($setup.FullName).sig"
          if (-not (Test-Path -LiteralPath $sigPath)) {
            throw "No updater signature was produced for $($setup.Name)"
          }

          $setupName = "NOORwave-${env:GITHUB_REF_NAME}-windows-x64-setup.exe"
          $targetSetup = Join-Path "dist" $setupName
          $targetSig = "$targetSetup.sig"
          Move-Item -LiteralPath $setup.FullName -Destination $targetSetup -Force
          Move-Item -LiteralPath $sigPath -Destination $targetSig -Force

          $hash = (Get-FileHash $targetSetup -Algorithm SHA256).Hash.ToLower()
          Add-Content -Path "dist\windows.sha256" -Value "$hash  $setupName"

          $signature = (Get-Content $targetSig -Raw).Trim()
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $json = @{
            version = $version
            notes = "${env:GITHUB_REF_NAME}"
            pub_date = (Get-Date -AsUTC).ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/biggiesmallcap-blip/NOORwave/releases/download/${env:GITHUB_REF_NAME}/$setupName"
              }
            }
          } | ConvertTo-Json -Depth 4
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText("dist\latest.json", $json, $utf8)

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256-windows
          path: dist/windows.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/NOORwave-${{ github.ref_name }}-windows-x64.zip
            dist/NOORwave-${{ github.ref_name }}-windows-x64-setup.exe
            dist/NOORwave-${{ github.ref_name }}-windows-x64-setup.exe.sig
            dist/latest.json

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          # Restore the cache warm-cache.yml saves on master. Actions caches
          # are ref-scoped and this workflow only runs on a tag, so anything
          # saved here was readable by that one tag and nothing else.
          shared-key: release-linux
          save-if: false

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-app/Cargo.toml
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-server/Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" noor-app/tauri.conf.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build binaries
        run: |
          cargo build --release --locked -p noor-server
          cargo build --release --locked -p noor-app

      - name: Assemble and archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/NOORwave
          cp target/release/noor-app dist/NOORwave/NOORwave
          cp target/release/noor-server dist/NOORwave/noor-server
          cp -r frontend/build dist/NOORwave/www
          tar -czf "dist/NOORwave-$TAG-linux-x64.tar.gz" -C dist NOORwave

      - name: Compute checksum
        run: cd dist && sha256sum "NOORwave-${{ github.ref_name }}-linux-x64.tar.gz" > linux-x64.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256-linux-x64
          path: dist/linux-x64.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/NOORwave-${{ github.ref_name }}-linux-x64.tar.gz

  build-macos-arm64:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false
          # Restore the cache warm-cache.yml saves on master. Actions caches
          # are ref-scoped and this workflow only runs on a tag, so anything
          # saved here was readable by that one tag and nothing else.
          shared-key: release-macos-arm64
          save-if: false

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-app/Cargo.toml
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-server/Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" noor-app/tauri.conf.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build binaries
        run: |
          cargo build --release --locked -p noor-server
          cargo build --release --locked -p noor-app

      - name: Assemble and archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/NOORwave
          cp target/release/noor-app dist/NOORwave/NOORwave
          cp target/release/noor-server dist/NOORwave/noor-server
          cp -r frontend/build dist/NOORwave/www
          tar -czf "dist/NOORwave-$TAG-macos-arm64.tar.gz" -C dist NOORwave

      - name: Compute checksum
        run: cd dist && sha256sum "NOORwave-${{ github.ref_name }}-macos-arm64.tar.gz" > macos-arm64.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256-macos-arm64
          path: dist/macos-arm64.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/NOORwave-${{ github.ref_name }}-macos-arm64.tar.gz

  build-macos-x64:
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-apple-darwin
          rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Targets cached (matching warm-cache.yml's macos-x64 job): once
          # Windows restores warm, this job at ~13 min becomes the release's
          # critical path. linux and macos-arm64 stay registry-only so four full
          # target caches cannot refill the 10 GB budget.
          cache-targets: true
          # Restore the cache warm-cache.yml saves on master. Actions caches
          # are ref-scoped and this workflow only runs on a tag, so anything
          # saved here was readable by that one tag and nothing else.
          shared-key: release-macos-x64
          save-if: false

      - name: Sync version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-app/Cargo.toml
          perl -i -pe "s/^version = \"[^\"]+\"/version = \"$VERSION\"/" noor-server/Cargo.toml
          perl -i -pe "s/\"version\": \"[^\"]+\"/\"version\": \"$VERSION\"/" noor-app/tauri.conf.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build binaries
        run: |
          cargo build --release --locked --target x86_64-apple-darwin -p noor-server
          cargo build --release --locked --target x86_64-apple-darwin -p noor-app

      - name: Assemble and archive
        run: |
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist/NOORwave
          cp target/x86_64-apple-darwin/release/noor-app dist/NOORwave/NOORwave
          cp target/x86_64-apple-darwin/release/noor-server dist/NOORwave/noor-server
          cp -r frontend/build dist/NOORwave/www
          tar -czf "dist/NOORwave-$TAG-macos-x64.tar.gz" -C dist NOORwave

      - name: Compute checksum
        run: cd dist && sha256sum "NOORwave-${{ github.ref_name }}-macos-x64.tar.gz" > macos-x64.sha256

      - name: Upload checksum artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sha256-macos-x64
          path: dist/macos-x64.sha256

      - name: Upload artifact
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/NOORwave-${{ github.ref_name }}-macos-x64.tar.gz

  publish-checksums:
    needs: [build-windows, build-linux, build-macos-arm64, build-macos-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Download all checksum artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sha256-*
          merge-multiple: true

      - name: Validate checksum artifacts
        shell: pwsh
        run: |
          $expected = @(
            "windows.sha256",
            "linux-x64.sha256",
            "macos-arm64.sha256",
            "macos-x64.sha256"
          )
          foreach ($file in $expected) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing checksum file: $file"
            }
          }
          $actual = @(Get-ChildItem -Filter "*.sha256")
          if ($actual.Count -ne 4) {
            throw "Expected 4 checksum files, found $($actual.Count)"
          }

      - name: Merge into sha256sums.txt
        run: cat *.sha256 | sort > sha256sums.txt

      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: sha256sums.txt
