name: PR check

# Runs on every pull request and on master pushes. Catches frontend regressions
# (lint, dead CSS, oversized chunks) before they hit a release tag. See
# release.yml for tag-time builds.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Test workspace
        run: cargo test --workspace --locked

  rust-clippy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-targets: false

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked

  frontend:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        working-directory: frontend
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Type check
        working-directory: frontend
        run: pnpm check

      - name: Test
        working-directory: frontend
        run: pnpm test

      - name: Build (fail on dead CSS or oversized chunks)
        working-directory: frontend
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee build.log
          if grep -E "Unused CSS selector" build.log; then
            echo "::error::Frontend build emitted Unused CSS selector warnings — delete the dead rules."
            exit 1
          fi
          if grep -E "chunks are larger than" build.log; then
            echo "::error::Frontend build emitted a chunk-size warning — split the offender or, if intentionally lazy, raise chunkSizeWarningLimit in vite.config.ts with a comment explaining why."
            exit 1
          fi
