name: Warm build cache

# Why this exists:
#   Release builds run only on `v*.*.*` tags, and GitHub scopes every Actions
#   cache to the ref that wrote it. A cache saved on `refs/tags/v0.11.39` can
#   never be read from `refs/tags/v0.11.40`, so every release recompiled from
#   scratch while leaving behind a cache nothing could ever restore. 42 of those
#   had piled up: 8.96 GB of a 10 GB repo budget, which then LRU-evicted the
#   caches pr-check actually needed and slowed PR runs down too.
#
#   Caches written on the DEFAULT branch are readable from every other ref. So
#   master warms them here, and release.yml restores them through matching
#   `shared-key`s while never saving (`save-if: false`), which stops tag runs
#   from producing unreachable caches ever again.
#
# Keeping it honest:
#   The compile steps mirror release.yml's build jobs, which all run the same
#   two cargo invocations (`scripts/build-portable.ps1` does the same on
#   Windows). That compile is the bulk of what a release pays for. Nothing here
#   uploads, signs, or publishes, so a failure in this workflow cannot break a
#   release -- the worst case is a cold cache, which is today's behaviour.
#
#   `cache-targets` is on only for the two jobs that gate the release wall
#   clock (windows ~21 min, macos-x64 ~13 min). linux and macos-arm64 stay
#   registry-only so four full target caches cannot refill the 10 GB budget and
#   restart the eviction problem this workflow exists to fix.

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer master push makes an in-flight warm run pointless; the cache it would
# save is already stale. Cancel rather than queue.
concurrency:
  group: warm-cache-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    name: warm (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            shared-key: release-windows
            target: ""
            cache-targets: "true"
          - name: macos-x64
            os: macos-latest
            shared-key: release-macos-x64
            target: x86_64-apple-darwin
            cache-targets: "true"
          - name: linux
            os: ubuntu-latest
            shared-key: release-linux
            target: ""
            cache-targets: "false"
          - name: macos-arm64
            os: macos-latest
            shared-key: release-macos-arm64
            target: ""
            cache-targets: "false"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libasound2-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libgtk-3-dev

      - name: Setup Rust
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          else
            rustup toolchain install stable --profile minimal
          fi
          rustup default stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Must match the corresponding job in release.yml. `shared-key`
          # replaces the automatic per-job key component, which is what lets a
          # cache saved by THIS workflow be restored by THAT one.
          shared-key: ${{ matrix.shared-key }}
          cache-targets: ${{ matrix.cache-targets }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # noor-app's Tauri build script needs the frontend dist to exist before
      # cargo will compile it.
      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Compile release binaries
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --locked --target "${{ matrix.target }}" -p noor-server
            cargo build --release --locked --target "${{ matrix.target }}" -p noor-app
          else
            cargo build --release --locked -p noor-server
            cargo build --release --locked -p noor-app
          fi
