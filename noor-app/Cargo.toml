[package]
name = "noor-app"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "noor-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png", "image-ico", "devtools"] }
# Keep the runtime family aligned; mixed versions previously broke Windows builds.
tauri-runtime = "=2.12.1"
tauri-runtime-wry = { version = "=2.12.1", default-features = false }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-single-instance = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "blocking"] }
tauri-plugin-opener = "2.5.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
# Same versions wry uses, for the video fullscreen switch.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "=2.12.1", features = ["test"] }
