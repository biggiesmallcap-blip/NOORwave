<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NOORwave</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at 50% 35%, #1a1f2e 0%, #0a0d14 65%, #05070b 100%);
        color: #e7eaf2;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        overflow: hidden;
      }
      .wrap {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      .icon {
        width: 96px;
        height: 96px;
        animation: pulse 1.8s ease-in-out infinite;
        filter: drop-shadow(0 8px 28px rgba(120, 150, 220, 0.18));
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50%      { opacity: 1;    transform: scale(1.04); }
      }
      .label {
        font-size: 13px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8b93a7;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
        <rect width="1024" height="1024" rx="224" fill="#2C3E50"/>
        <g fill="none" stroke="#FFFFFF" stroke-width="14">
          <circle cx="384" cy="512" r="180"/>
          <circle cx="384" cy="512" r="74"/>
          <circle cx="640" cy="512" r="180"/>
          <circle cx="640" cy="512" r="74"/>
        </g>
      </svg>
      <div class="label">NOORwave</div>
    </div>
  </body>
</html>
