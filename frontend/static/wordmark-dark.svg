<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="NoorWave logo (dark mode variant)">
  <title>NoorWave wordmark — dark mode</title>
  <desc>Dark-mode variant of the NoorWave horizontal lockup. Off-white text on transparent background, for use on dark website hero sections, marketing material, or app splash overlays.</desc>

  <!-- Brand palette (dark mode)
       F5F7F9 off-white         primary text and structural rings
       22E0D6 signal aqua       accent / active state
       7BD4CC lighter teal      tagline (less harsh than full aqua) -->

  <!-- N -->
  <text x="130" y="178"
        font-family="Inter, Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="100" font-weight="800" fill="#F5F7F9">N</text>

  <!-- O ring 1 (clean) -->
  <g transform="translate(245, 140)">
    <circle r="32" fill="none" stroke="#F5F7F9" stroke-width="3.6"/>
    <circle r="23" fill="none" stroke="#22E0D6" stroke-width="2.6"/>
    <circle r="14" fill="none" stroke="#F5F7F9" stroke-width="2"/>
  </g>

  <!-- O ring 2 (with waveform) -->
  <g transform="translate(316, 140)">
    <circle r="32" fill="none" stroke="#F5F7F9" stroke-width="3.6"/>
    <circle r="23" fill="none" stroke="#22E0D6" stroke-width="2.6"/>
    <circle r="14" fill="none" stroke="#F5F7F9" stroke-width="2"/>
    <path d="M -10 0 Q -7 -5, -5 -1 T 5 1 T 10 -1.5"
          stroke="#22E0D6" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- R -->
  <text x="356" y="178"
        font-family="Inter, Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="100" font-weight="800" fill="#F5F7F9">R</text>

  <!-- wave (light weight) -->
  <text x="425" y="178"
        font-family="Inter, Manrope, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="100" font-weight="200" fill="#F5F7F9" letter-spacing="-2">wave</text>

  <!-- Tagline with flanking accent rules -->
  <line x1="200" y1="220" x2="270" y2="220" stroke="#22E0D6" stroke-width="1.4"/>
  <line x1="490" y1="220" x2="560" y2="220" stroke="#22E0D6" stroke-width="1.4"/>
  <text x="380" y="225" text-anchor="middle"
        font-family="Inter, Manrope, system-ui, sans-serif"
        font-size="13" font-weight="500" fill="#22E0D6" letter-spacing="3">PURE SOUND  ·  PERFECT FLOW</text>
</svg>
