<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160" role="img" aria-label="NoorWave mark (continuous wave)">
  <title>NoorWave continuous wave mark</title>
  <desc>Animated OO mark. A single continuous sine wave flows through both circles in perfect sync — the two Os are part of one signal. 3-second loop. Transparent background.</desc>

  <defs>
    <clipPath id="innerOO">
      <circle cx="96" cy="80" r="28"/>
      <circle cx="224" cy="80" r="28"/>
    </clipPath>
  </defs>

  <!-- Left ring -->
  <circle cx="96" cy="80" r="60" fill="none" stroke="#0B1220" stroke-width="5"/>
  <circle cx="96" cy="80" r="46" fill="none" stroke="#22E0D6" stroke-width="4">
    <animate attributeName="stroke-width"
             values="4;4.7;4" dur="3s" repeatCount="indefinite"
             calcMode="spline" keyTimes="0;0.5;1"
             keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
  </circle>
  <circle cx="96" cy="80" r="30" fill="none" stroke="#0B1220" stroke-width="3.5"/>

  <!-- Right ring -->
  <circle cx="224" cy="80" r="60" fill="none" stroke="#0B1220" stroke-width="5"/>
  <circle cx="224" cy="80" r="46" fill="none" stroke="#22E0D6" stroke-width="4">
    <animate attributeName="stroke-width"
             values="4;4.7;4" dur="3s" repeatCount="indefinite"
             calcMode="spline" keyTimes="0;0.5;1"
             keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
  </circle>
  <circle cx="224" cy="80" r="30" fill="none" stroke="#0B1220" stroke-width="3.5"/>

  <!-- Continuous wave through both inner circles, in perfect sync -->
  <g clip-path="url(#innerOO)">
    <path d="M -128 80 Q -120.00 70, -112.00 80 Q -104.00 90, -96.00 80 Q -88.00 70, -80.00 80 Q -72.00 90, -64.00 80 Q -56.00 70, -48.00 80 Q -40.00 90, -32.00 80 Q -24.00 70, -16.00 80 Q -8.00 90, 0.00 80 Q 8.00 70, 16.00 80 Q 24.00 90, 32.00 80 Q 40.00 70, 48.00 80 Q 56.00 90, 64.00 80 Q 72.00 70, 80.00 80 Q 88.00 90, 96.00 80 Q 104.00 70, 112.00 80 Q 120.00 90, 128.00 80 Q 136.00 70, 144.00 80 Q 152.00 90, 160.00 80 Q 168.00 70, 176.00 80 Q 184.00 90, 192.00 80 Q 200.00 70, 208.00 80 Q 216.00 90, 224.00 80 Q 232.00 70, 240.00 80 Q 248.00 90, 256.00 80 Q 264.00 70, 272.00 80 Q 280.00 90, 288.00 80 Q 296.00 70, 304.00 80 Q 312.00 90, 320.00 80 Q 328.00 70, 336.00 80 Q 344.00 90, 352.00 80 Q 360.00 70, 368.00 80 Q 376.00 90, 384.00 80 Q 392.00 70, 400.00 80 Q 408.00 90, 416.00 80 Q 424.00 70, 432.00 80 Q 440.00 90, 448.00 80"
          stroke="#22E0D6" stroke-width="3.2" fill="none"
          stroke-linecap="round" stroke-linejoin="round">
      <animateTransform attributeName="transform" type="translate"
                        from="0 0" to="-32 0"
                        dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
